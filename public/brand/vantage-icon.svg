<?xml version="1.0" encoding="UTF-8"?>
<!--
  Vantage favicon. The mark reduced to what survives at 16px: the goalpost, a
  four-point trend line, and no plot furniture.

  This is the one Vantage artwork that carries literal hex. A favicon renders in
  an isolated context where the page's stylesheet never loads, so the tokens in
  globals.css cannot reach it and var() would resolve to nothing. The values are
  the operator's: amber is the brand amber exactly, and the navy plate is
  specific to the icon — it exists so the mark has a ground of its own in a
  browser tab, and is not a site colour.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"
     role="img" aria-labelledby="vfa-f">
  <title id="vfa-f">Vantage</title>
  <rect width="200" height="200" rx="44" fill="#131C2E" stroke="#2A3A55" stroke-width="3"/>
  <path d="M62 100L88 74L112 88L136 48" fill="none" stroke="#EF9F27"
        stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40 33V129H160V33" fill="none" stroke="#F5F7FA" stroke-width="15"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M100 129V167" stroke="#F5F7FA" stroke-width="15" stroke-linecap="round"/>
</svg>
